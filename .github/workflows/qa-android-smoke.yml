name: QA Android Smoke (e2e)

# MEL-010 v0.2.6.11 — workflow QA pre-merge skeleton.
# Status: ESTRUTURA CRIADA, secrets pendentes.
#
# Pré-requisitos pra ativar:
# - Secrets GitHub Repo:
#   - DOSY_E2E_KEYSTORE_BASE64 — keystore release.keystore em base64
#   - DOSY_E2E_KEYSTORE_PROPS_BASE64 — keystore.properties em base64
#   - VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_SUPABASE_SCHEMA
#   - VITE_VAPID_PUBLIC_KEY, VITE_SENTRY_DSN, VITE_ADMOB_BANNER_ANDROID
#
# Trigger:
#   - workflow_dispatch (manual)
#   - pull_request paths: src/**, e2e/**, android/** (opcional, comentado por enquanto)
#
# Quando ativar:
#   1. Adicionar secrets acima no repo Settings → Secrets.
#   2. Descomentar bloco pull_request abaixo.
#   3. PR-protect master → require check "QA Android Smoke (e2e)".
#
# Custo estimado: ~10-15min por run × GitHub free tier 2000 min/mês = ~130-200 runs/mês.
# Suficiente pra suite externa pre-merge sem extrapolar quota.

on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - 'src/**'
  #     - 'e2e/**'
  #     - 'android/**'

jobs:
  e2e-smoke:
    name: e2e/ smoke (Appium emulator headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps (root + e2e)
        run: |
          npm ci
          cd e2e && npm install

      - name: Decode keystore (release signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.DOSY_E2E_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS_BASE64: ${{ secrets.DOSY_E2E_KEYSTORE_PROPS_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::DOSY_E2E_KEYSTORE_BASE64 secret missing — build debug variant only"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > dosy-release.keystore
          echo "$KEYSTORE_PROPS_BASE64" | base64 -d > android/keystore.properties

      - name: Build web bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SCHEMA: medcontrol
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_ADMOB_BANNER_ANDROID: ${{ secrets.VITE_ADMOB_BANNER_ANDROID }}

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK devDebug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDevDebug

      - name: Run Appium e2e on headless emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_8
          script: |
            adb install -r -t android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
            cd e2e && npm run e2e
        continue-on-error: true   # smoke — não bloqueia merge enquanto suite cresce

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e/logs/
            e2e/screenshots/
          retention-days: 7
          if-no-files-found: ignore
